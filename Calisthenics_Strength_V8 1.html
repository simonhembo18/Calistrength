<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Calisthenics V8</title><style>:root{--b:#07111f;--c:#101d31;--l:#263955;--t:#f4f7fb;--m:#9fb0c5;--a:#62e6a7}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,Segoe UI,sans-serif;padding-bottom:82px}header{padding:18px;position:sticky;top:0;background:#07111ff5;border-bottom:1px solid var(--l);z-index:3}h1{margin:0;font-size:23px}.sub,.muted{color:var(--m);font-size:13px}.screen{display:none;padding:15px;max-width:680px;margin:auto}.active{display:block}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;gap:9px;align-items:center}.spread{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select,textarea{width:100%;padding:10px;border:1px solid #38506e;border-radius:10px;background:#091627;color:#fff;font-size:15px}label{display:block;color:var(--m);font-size:12px;margin:7px 0 4px}button{padding:11px 13px;border:0;border-radius:11px;background:var(--a);color:#062018;font-weight:800}.secondary{background:#16263d;color:#fff;border:1px solid var(--l)}.danger{background:#963747;color:#fff}.target{font-weight:800;color:var(--a);font-size:18px;margin:8px 0}.done{border-color:#2b996d;background:#102c28}.status{color:var(--a);background:#102c28;padding:10px;border-radius:10px;margin-bottom:12px}nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#081220;padding:7px 5px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--l)}nav button{background:none;color:var(--m);font-size:12px}.navon{color:var(--a)}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.setupCard summary{font-weight:800;cursor:pointer}.small{font-size:12px}.full{width:100%;margin-top:10px}.movebar{display:flex;gap:7px;align-items:center;margin:10px 0}.movebar button{padding:8px 11px}.dragHandle{cursor:grab;user-select:none;color:var(--m);font-weight:800}.dragging{opacity:.45}.removeSlot{margin-top:9px;width:100%}.suggest{background:#192f3b;border:1px solid #4ca779;border-radius:11px;padding:10px;margin:9px 0;color:#caffdf}.suggest b{color:var(--a)}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{background:#091627;border:1px solid var(--l);border-radius:12px;padding:10px}.stat strong{display:block;font-size:19px;color:var(--a)}canvas{width:100%;height:240px;background:#091627;border-radius:12px}.warn{background:#382925;color:#ffd0a8;border:1px solid #8d684a;padding:10px;border-radius:10px}.good{color:var(--a)}</style></head><body><header><h1>Calisthenics Strength</h1><div class="sub">Progression assistant • Version 8</div></header><main><section id="home" class="screen active"></section><section id="train" class="screen"></section><section id="progress" class="screen"></section><section id="setup" class="screen"></section></main><nav><button data-p="home" class="navon">⌂<br>Home</button><button data-p="train">＋<br>Train</button><button data-p="progress">↗<br>Progress</button><button data-p="setup">⚙<br>Setup</button></nav><script>
'use strict';const DEFAULT_ITEMS=[{"id":"bench-heavy","name":"Bench Press - Heavy","benchmark":100,"unit":"kg","benchmarkType":"1 rep max","low":80,"high":85,"range":"4-6 reps"},{"id":"bench-light","name":"Bench Press - Light","benchmark":100,"unit":"kg","benchmarkType":"1 rep max","low":55,"high":65,"range":"10-12 reps"},{"id":"dip-heavy","name":"Weighted Dips - Heavy","benchmark":45,"unit":"kg","benchmarkType":"4 rep max","low":90,"high":100,"range":"4-6 reps"},{"id":"pullup-heavy","name":"Weighted Pull-ups - Heavy","benchmark":25,"unit":"kg","benchmarkType":"4 rep max","low":70,"high":100,"range":"4-6 reps"},{"id":"chin-heavy","name":"Weighted Chin-ups - Heavy","benchmark":45,"unit":"kg","benchmarkType":"4 rep max","low":85,"high":100,"range":"4-6 reps"},{"id":"dead-heavy","name":"Deadlift - Heavy","benchmark":90,"unit":"kg","benchmarkType":"4 rep max","low":75,"high":90,"range":"4-6 reps"},{"id":"dead-light","name":"Deadlift - Light","benchmark":90,"unit":"kg","benchmarkType":"4 rep max","low":50,"high":70,"range":"10-12 reps"},{"id":"squat-heavy","name":"Squat - Heavy","benchmark":80,"unit":"kg","benchmarkType":"4 rep max","low":80,"high":85,"range":"4-6 reps"},{"id":"squat-light","name":"Squat - Light","benchmark":80,"unit":"kg","benchmarkType":"4 rep max","low":55,"high":65,"range":"10-12 reps"},{"id":"planche-red","name":"Planche Practice - Red Band","benchmark":7,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":100,"range":""},{"id":"planche-yellow","name":"Planche Practice - Yellow Band","benchmark":12,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":100,"range":""},{"id":"planche-green","name":"Planche Practice - Green Band","benchmark":19,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":100,"range":""},{"id":"hspu","name":"Handstand Press-ups","benchmark":6,"unit":"reps","benchmarkType":"Max reps","low":80,"high":100,"range":""},{"id":"muscle","name":"Muscle-ups","benchmark":5,"unit":"reps","benchmarkType":"Max reps","low":80,"high":100,"range":""},{"id":"front-heavy","name":"Front Lever - Heavy","benchmark":15,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":100,"range":""},{"id":"front-light","name":"Front Lever - Light","benchmark":15,"unit":"seconds","benchmarkType":"Max hold","low":50,"high":70,"range":""},{"id":"rear-heavy","name":"Back/Rear Lever - Heavy","benchmark":15,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":100,"range":""},{"id":"rear-light","name":"Back/Rear Lever - Light","benchmark":15,"unit":"seconds","benchmarkType":"Max hold","low":50,"high":70,"range":""},{"id":"pullups","name":"Pull-ups","benchmark":25,"unit":"reps","benchmarkType":"Max reps","low":70,"high":100,"range":""},{"id":"chinups","name":"Chin-ups","benchmark":25,"unit":"reps","benchmarkType":"Max reps","low":70,"high":100,"range":""},{"id":"dragon","name":"Dragon Flags","benchmark":14,"unit":"reps","benchmarkType":"Max reps","low":80,"high":90,"range":""},{"id":"straight","name":"Straight-arm Pull-through","benchmark":3,"unit":"reps","benchmarkType":"Max reps","low":60,"high":100,"range":""},{"id":"toes","name":"Toes to Bar","benchmark":12,"unit":"reps","benchmarkType":"Max reps","low":90,"high":120,"range":""},{"id":"pike","name":"Pike Press-ups","benchmark":12,"unit":"reps","benchmarkType":"Max reps","low":90,"high":100,"range":""},{"id":"planche-push","name":"Planche Press-ups","benchmark":22,"unit":"reps","benchmarkType":"Max reps","low":80,"high":100,"range":""},{"id":"unweighted-dips","name":"Unweighted Dips","benchmark":35,"unit":"reps","benchmarkType":"Max reps","low":80,"high":100,"range":""},{"id":"lsit","name":"L-sit","benchmark":45,"unit":"seconds","benchmarkType":"Max hold","low":80,"high":120,"range":""},{"id":"planche-lifts","name":"Planche Lifts","benchmark":8,"unit":"reps","benchmarkType":"Max reps","low":80,"high":120,"range":""}],DEFAULT_DAYS=[{"name":"Day 1 Push Strength","slots":["planche-red","planche-yellow","planche-green","hspu","muscle","bench-heavy","dip-heavy","squat-heavy","planche-lifts"]},{"name":"Day 2 Pull Strength","slots":["front-heavy","rear-heavy","pullup-heavy","chin-heavy","dead-heavy","dragon","straight"]},{"name":"Day 3 Push Volume","slots":["planche-green","planche-yellow","pike","planche-push","unweighted-dips","bench-light","squat-light","lsit"]},{"name":"Day 4 Pull Volume","slots":["front-light","rear-light","pullups","chinups","dead-light","dragon","toes"]}],$=x=>document.getElementById(x);const clone=v=>JSON.parse(JSON.stringify(v));let s;try{s=JSON.parse(localStorage.getItem('calV8'))||JSON.parse(localStorage.getItem('calV7'))||JSON.parse(localStorage.getItem('calV6'))||JSON.parse(localStorage.getItem('calV5'))}catch(e){}if(!s||!Array.isArray(s.items)||!Array.isArray(s.days))s={week:1,items:clone(DEFAULT_ITEMS),days:clone(DEFAULT_DAYS),logs:[]};let currentDay=0;function persist(){localStorage.setItem('calV8',JSON.stringify(s));render()}function page(p){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('navon',x.dataset.p===p));scrollTo(0,0)}document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>page(x.dataset.p));function item(id){return s.items.find(x=>x.id===id)||s.items[0]}function esc(v){let x=document.createElement('div');x.textContent=String(v??'');return x.innerHTML}function options(selected){return s.items.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function target(x){let benchmark=Number(x.benchmark)||0,low=Number(x.low)||0,high=Number(x.high)||0,a=Math.round(benchmark*low/100),b=Math.round(benchmark*high/100);return `${a}-${b} ${x.unit||''}${x.range?' for '+x.range:''}`.trim()}function home(){let done=s.logs.filter(x=>x.week===s.week&&x.completed).length;$('home').innerHTML=`<div class="status">Every training slot now selects from all Setup items.</div><div class="card row spread"><div><div class="muted">CURRENT WEEK</div><h2>Week ${s.week} of 8</h2><div>${done} completed</div></div><select id="week" style="width:90px">${[1,2,3,4,5,6,7,8].map(w=>`<option ${w===s.week?'selected':''}>${w}</option>`).join('')}</select></div>${s.days.map((d,i)=>`<div class="card row spread"><h3>${d.name}</h3><button type="button" class="secondary open" data-i="${i}">Open</button></div>`).join('')}`;$('week').onchange=e=>{s.week=+e.target.value;persist()};document.querySelectorAll('.open').forEach(x=>x.onclick=()=>{currentDay=+x.dataset.i;workout();page('train')})}function num(v){let n=parseFloat(v);return Number.isFinite(n)?n:0}function historyFor(id,beforeWeek){return s.logs.filter(r=>r.itemId===id&&r.completed&&r.week<beforeWeek).sort((a,b)=>a.week-b.week||String(a.updated||'').localeCompare(String(b.updated||'')))}function score(r,x){let reps1=num(r.a),reps2=num(r.b),load1=num(r.c),load2=num(r.d);if(x.unit==='kg'){let e1=load1*(1+reps1/30),e2=load2*(1+reps2/30);return Math.max(e1,e2)}return Math.max(reps1,reps2)}function suggestion(id,week){let x=item(id),h=historyFor(id,week);if(!h.length)return null;let last=h[h.length-1],prev=h.length>1?h[h.length-2]:null,a=num(last.a),b=num(last.b),c=num(last.c),d=num(last.d),txt='',vals={a,b,c,d};if(x.unit==='kg'){let maxRep=6,m=String(x.range||'').match(/(\d+)\s*-\s*(\d+)/);if(m)maxRep=+m[2];let step=Math.max(1,Math.round(Math.max(c,d)*.025/2.5)*2.5);let improved=!prev||score(last,x)>=score(prev,x)*.99;if(a>=maxRep&&b>=maxRep&&improved){vals={a:Math.max(3,maxRep-3),b:Math.max(3,maxRep-3),c:c+step,d:d+step};txt=`Progress load by ${step} kg` }else if(improved){vals={a:Math.min(maxRep,a+1),b:Math.min(maxRep,b+1),c,d};txt='Keep the load and add one rep where possible'}else{vals={a,b,c,d};txt='Repeat the previous session and prioritise recovery'}}else{let best=Math.max(a,b),old=prev?score(prev,x):0;if(prev&&best<old){vals={a,b,c:0,d:0};txt='Repeat the previous target; performance dipped'}else{vals={a:a+1,b:b+1,c:0,d:0};txt=`Aim to add 1 ${x.unit==='seconds'?'second':'rep'} per set`}}return {txt,vals,lastWeek:last.week}}function suggestedHtml(id,week){let z=suggestion(id,week);if(!z)return '';let x=item(id),v=z.vals,detail=x.unit==='kg'?`Set 1: ${v.c} kg × ${v.a} | Set 2: ${v.d} kg × ${v.b}`:`Set 1: ${v.a} ${x.unit} | Set 2: ${v.b} ${x.unit}`;return `<div class="suggest"><b>Suggested goal from Week ${z.lastWeek}</b><br>${detail}<br><span class="small">${z.txt}. Guidance only; record what you actually complete.</span></div>`}function workout(){let d=s.days[currentDay];$('train').innerHTML=`<div class="row spread"><h2>${d.name}</h2><select id="day" style="width:105px">${s.days.map((x,i)=>`<option value="${i}" ${i===currentDay?'selected':''}>Day ${i+1}</option>`).join('')}</select></div>${d.slots.map((id,i)=>{let x=item(id),v=s.logs.find(r=>r.week===s.week&&r.day===currentDay&&r.slot===i)||{};return `<div class="card ${v.completed?'done':''}"><label>Training item</label><select class="slotItem" data-i="${i}">${options(id)}</select><div class="target">Target: ${target(x)}</div>${suggestedHtml(id,s.week)}<div class="muted">Benchmark ${x.benchmark} ${x.unit} • ${x.benchmarkType} • ${x.low}-${x.high}%</div><div class="grid"><div><label>Set 1 reps / sec</label><input id="a${i}" value="${esc(v.a)}"></div><div><label>Set 2 reps / sec</label><input id="b${i}" value="${esc(v.b)}"></div><div><label>Load set 1</label><input id="c${i}" value="${esc(v.c)}"></div><div><label>Load set 2</label><input id="d${i}" value="${esc(v.d)}"></div></div><label>Notes</label><textarea id="n${i}">${esc(v.notes)}</textarea><label><input type="checkbox" id="done${i}" style="width:auto" ${v.completed?'checked':''}> Completed</label><button type="button" class="saveLog full" data-i="${i}">Save exercise</button><button type="button" class="removeSlot danger" data-i="${i}">Remove exercise from this day</button></div>`}).join('')}<button type="button" id="addSlot" class="secondary full">Add exercise slot to this day</button><button type="button" id="resetDay" class="danger full">Reset this training day</button>`;$('day').onchange=e=>{currentDay=+e.target.value;workout()};document.querySelectorAll('.slotItem').forEach(x=>x.onchange=()=>{d.slots[+x.dataset.i]=x.value;persist();workout()});document.querySelectorAll('.saveLog').forEach(x=>x.onclick=()=>log(+x.dataset.i));document.querySelectorAll('.removeSlot').forEach(x=>x.onclick=()=>{let i=+x.dataset.i;if(!confirm('Remove this exercise from the training day?'))return;d.slots.splice(i,1);s.logs=s.logs.filter(r=>!(r.day===currentDay&&r.slot===i)).map(r=>r.day===currentDay&&r.slot>i?{...r,slot:r.slot-1}:r);persist();workout()});$('addSlot').onclick=()=>{d.slots.push(s.items[0].id);persist();workout()};$('resetDay').onclick=()=>{if(!confirm('Reset this training day for the current week? This clears all saved entries and completion ticks for this day.'))return;s.logs=s.logs.filter(r=>!(r.week===s.week&&r.day===currentDay));persist();workout()}}function log(i){let idx=s.logs.findIndex(x=>x.week===s.week&&x.day===currentDay&&x.slot===i),r={week:s.week,day:currentDay,slot:i,itemId:s.days[currentDay].slots[i],a:$('a'+i).value,b:$('b'+i).value,c:$('c'+i).value,d:$('d'+i).value,notes:$('n'+i).value,completed:$('done'+i).checked,updated:new Date().toISOString()};idx<0?s.logs.push(r):s.logs[idx]=r;persist();workout()}function progress(){let selected=s.progressItem&&s.items.some(x=>x.id===s.progressItem)?s.progressItem:(s.items[0]&&s.items[0].id);s.progressItem=selected;let completed=s.logs.filter(x=>x.completed),days=new Set(completed.map(x=>x.week+'-'+x.day)).size,sets=completed.reduce((n,r)=>n+(String(r.a||'').trim()?1:0)+(String(r.b||'').trim()?1:0),0);let weekly=[1,2,3,4,5,6,7,8].map(w=>{let ls=completed.filter(x=>x.week===w),ds=new Set(ls.map(x=>x.day)).size,st=ls.reduce((n,r)=>n+(String(r.a||'').trim()?1:0)+(String(r.b||'').trim()?1:0),0);return {w,c:ls.length,d:ds,st}});let x=item(selected),ih=completed.filter(r=>r.itemId===selected).sort((a,b)=>a.week-b.week),rows=ih.map(r=>`<div class="card"><b>Week ${r.week}</b><div>${x.unit==='kg'?`Set 1: ${esc(r.c)} kg × ${esc(r.a)} | Set 2: ${esc(r.d)} kg × ${esc(r.b)}`:`Set 1: ${esc(r.a)} ${esc(x.unit)} | Set 2: ${esc(r.b)} ${esc(x.unit)}`}</div><div class="muted">Performance score: ${score(r,x).toFixed(1)}</div></div>`).join('')||'<div class="card muted">No completed history for this exercise yet.</div>';$('progress').innerHTML=`<h2>Progress dashboard</h2><div class="statgrid"><div class="stat"><strong>${completed.length}</strong>Exercises completed</div><div class="stat"><strong>${days}</strong>Training days</div><div class="stat"><strong>${sets}</strong>Sets recorded</div><div class="stat"><strong>${new Set(completed.map(r=>r.week)).size}</strong>Weeks trained</div></div><h3>Weekly activity</h3>${weekly.map(q=>`<div class="card row spread"><b>Week ${q.w}</b><span>${q.c} exercises · ${q.d} days · ${q.st} sets</span></div>`).join('')}<h3>Exercise trend</h3><select id="progressItem">${options(selected)}</select><div class="card"><canvas id="trendChart" width="640" height="240"></canvas><div class="muted">Weighted exercises use estimated 1RM (Epley). Reps and holds use the best completed set.</div></div>${suggestedHtml(selected,Math.min(8,(Math.max(0,...ih.map(r=>r.week))+1)))}${rows}`;$('progressItem').onchange=e=>{s.progressItem=e.target.value;localStorage.setItem('calV8',JSON.stringify(s));progress()};setTimeout(()=>drawTrend(selected),0)}function drawTrend(id){let cv=$('trendChart');if(!cv)return;let ctx=cv.getContext('2d'),x=item(id),pts=[1,2,3,4,5,6,7,8].map(w=>{let rs=s.logs.filter(r=>r.completed&&r.itemId===id&&r.week===w);return rs.length?Math.max(...rs.map(r=>score(r,x))):null});ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#263955';ctx.fillStyle='#9fb0c5';ctx.font='12px sans-serif';for(let i=0;i<8;i++){let px=45+i*82;ctx.beginPath();ctx.moveTo(px,18);ctx.lineTo(px,205);ctx.stroke();ctx.fillText('W'+(i+1),px-8,225)}let vals=pts.filter(v=>v!==null),max=Math.max(1,...vals)*1.1,min=Math.min(0,...vals);ctx.strokeStyle='#62e6a7';ctx.lineWidth=3;ctx.beginPath();let begun=false;pts.forEach((v,i)=>{if(v===null)return;let px=45+i*82,py=195-(v-min)/(max-min)*165;if(!begun){ctx.moveTo(px,py);begun=true}else ctx.lineTo(px,py);ctx.fillStyle='#62e6a7';ctx.fillRect(px-4,py-4,8,8);ctx.fillStyle='#f4f7fb';ctx.fillText(v.toFixed(1),px-12,py-10)});ctx.stroke()}function setup(){let units=['kg','reps','seconds','max hold'];$('setup').innerHTML=`<h2>Training item database</h2><div class="status">Heavy and light versions are separate items with independent percentages and working ranges.</div><button id="newItem" type="button" class="full">Create new training item</button><div style="height:10px"></div>${s.items.map((x,i)=>`<details class="card setupCard" draggable="true" data-i="${i}"><summary>${esc(x.name||'Untitled training item')}</summary><div class="movebar"><span class="dragHandle">☰ Drag to relocate</span><button type="button" class="moveUp secondary" data-i="${i}">↑</button><button type="button" class="moveDown secondary" data-i="${i}">↓</button></div><label>Training item name</label><input class="name" data-i="${i}" value="${esc(x.name)}"><div class="grid"><div><label>Benchmark</label><input class="benchmark" data-i="${i}" inputmode="decimal" value="${x.benchmark}"></div><div><label>Unit</label><select class="unit" data-i="${i}">${units.map(u=>`<option ${u===x.unit?'selected':''}>${u}</option>`).join('')}</select></div><div><label>Low %</label><input class="low" data-i="${i}" inputmode="decimal" value="${x.low}"></div><div><label>High %</label><input class="high" data-i="${i}" inputmode="decimal" value="${x.high}"></div><div><label>Benchmark type</label><input class="type" data-i="${i}" value="${esc(x.benchmarkType)}"></div><div><label>Working range</label><input class="range" data-i="${i}" value="${esc(x.range)}"></div></div><button type="button" class="delete danger full" data-i="${i}">Delete item</button></details>`).join('')}`;document.querySelectorAll('.name,.benchmark,.unit,.low,.high,.type,.range').forEach(el=>el.onchange=()=>{let x=s.items[+el.dataset.i],k=el.className;x[k]=['benchmark','low','high'].includes(k)?+el.value:el.value;localStorage.setItem('calV8',JSON.stringify(s));workout();progress();home();if(k==='name'){let summary=el.closest('.setupCard').querySelector('summary');summary.textContent=el.value||'Untitled training item'}});function moveItem(from,to){if(to<0||to>=s.items.length||from===to)return;let openId=s.items[from].id,[moved]=s.items.splice(from,1);s.items.splice(to,0,moved);localStorage.setItem('calV8',JSON.stringify(s));setup();let card=[...document.querySelectorAll('.setupCard')].find(c=>s.items[+c.dataset.i].id===openId);if(card){card.open=true;card.scrollIntoView({block:'nearest'})}}document.querySelectorAll('.moveUp').forEach(el=>el.onclick=()=>moveItem(+el.dataset.i,+el.dataset.i-1));document.querySelectorAll('.moveDown').forEach(el=>el.onclick=()=>moveItem(+el.dataset.i,+el.dataset.i+1));let dragFrom=null;document.querySelectorAll('.setupCard').forEach(card=>{card.ondragstart=e=>{dragFrom=+card.dataset.i;card.classList.add('dragging');e.dataTransfer.effectAllowed='move'};card.ondragend=()=>card.classList.remove('dragging');card.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move'};card.ondrop=e=>{e.preventDefault();let to=+card.dataset.i;if(dragFrom!==null)moveItem(dragFrom,to);dragFrom=null}});document.querySelectorAll('.delete').forEach(el=>el.onclick=()=>{let x=s.items[+el.dataset.i];if(s.days.some(d=>d.slots.includes(x.id)))return alert('This item is used on a training day. Select a replacement there first.');s.items.splice(+el.dataset.i,1);persist()});$('newItem').addEventListener('click',()=>{let id='item-'+Date.now();s.items.push({id,name:'',benchmark:'',unit:'reps',benchmarkType:'',low:'',high:'',range:''});localStorage.setItem('calV8',JSON.stringify(s));setup();let cards=document.querySelectorAll('.setupCard'),card=cards[cards.length-1];if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'start'});let input=card.querySelector('.name');if(input)input.focus()}})}function render(){home();workout();progress();setup()}render();
</script></body></html>
